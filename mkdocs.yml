site_name: Стайлгайд «Победы»
site_description: Руководство по стилю пользовательской и справочной документации сайта авиакомпании «Победа»
docs_dir: docs
site_dir: site

nav:
  - Главная: index.md
  - Тон коммуникации: tone-of-voice.md
  - Терминология и форматы: glossary-and-formats.md
  - Веб-интерфейс: web-interface.md
  - Инструкции: instructions.md
  - Системные сообщения: system-messages.md
  - Предупреждения: warnings.md
  - Доступность текста: accessibility.md

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search:
      lang:
        - ru
        - en

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
